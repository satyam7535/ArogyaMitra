# ArogyaMitra Production Edge Gateway — Nginx Reverse Proxy Configuration
# Provides TLS 1.3 termination, HSTS enforcement, security headers, rate limiting,
# and internal microservice network isolation.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Hide server version tokens
    server_tokens off;

    # WebSocket connection upgrade mapping (prevents H2C smuggling)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate Limiting Zones
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/m;

    # Upstream Services
    upstream backend_service {
        server backend:5000;
        keepalive 32;
    }

    upstream frontend_service {
        server frontend:8501;
        keepalive 16;
    }

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name arogyamitra.local *.arogyamitra.local;

        # Redirect all HTTP requests to HTTPS with 301 Permanent Redirect
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Production Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name arogyamitra.local *.arogyamitra.local;

        # TLS Configuration (TLS 1.2 and 1.3 only)
        ssl_certificate     /etc/nginx/certs/arogyamitra.crt;
        ssl_certificate_key /etc/nginx/certs/arogyamitra.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_tickets off;

        # Strict Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Client body limit (prevent large buffer attacks)
        client_max_body_size 10M;

        # ── Backend API Proxy ────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=50 nodelay;

            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
        }

        # ── Strict Rate-Limited Authentication Routes ─────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Block direct external access to internal ML & Graph services ─────
        # ML (:8000) and Graph (:8001) are internal microservices only.
        location /predict {
            return 403 "Direct access to internal ML microservice is forbidden.\n";
        }

        location /analyze {
            return 403 "Direct access to internal Graph pipeline is forbidden. Route requests through /api/v1/consultation/:id/analyze.\n";
        }

        # ── Frontend Web Application Proxy (Streamlit / React) ───────────────
        location / {
            proxy_pass http://frontend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400; # WebSocket support for Streamlit
        }
    }
}
