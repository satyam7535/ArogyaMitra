[project]
name = "arogyamitra"
version = "1.0.0"
description = "ArogyaMitra Healthcare Decision Support Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "shap>=0.46.0",
    "lime>=0.2.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "openai>=1.50.0",
    "reportlab>=4.2.0",
    "pillow>=10.4.0",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9.0",
    "streamlit>=1.40.0",
    "requests>=2.32.0",
    "plotly>=5.24.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "node_modules", ".git"]
