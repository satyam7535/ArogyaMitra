name: arogyamitra

services:
  # ── Edge Reverse Proxy (Sole Public Ingress) ─────────────────────────────────
  proxy:
    image: nginx:1.27-alpine
    container_name: arogya-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - arogya-network
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── MongoDB Database (Internal Only) ─────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: arogya-mongo
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - arogya-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── ML Prediction Service (FastAPI — Internal Only) ──────────────────────────
  ml:
    build:
      context: ./ML_Model
      dockerfile: Dockerfile
    container_name: arogya-ml
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./config:/config:ro
    environment:
      - PORT=8000
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - GIT_COMMIT=540e05f
    networks:
      - arogya-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── LangGraph Workflow Orchestration (Internal Only) ─────────────────────────
  graph:
    build:
      context: ./graph
      dockerfile: Dockerfile
    container_name: arogya-graph
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - PORT=8001
      - ML_API_URL=http://ml:8000
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gemini-2.5-flash}
    networks:
      - arogya-network
    depends_on:
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Express Backend API (Internal Only) ──────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: arogya-backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DB_URL=mongodb://mongo:27017/arogyamitra
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=15m
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - REFRESH_TOKEN_EXPIRY=7d
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - ML_API_URL=http://ml:8000
      - AI_SERVICE_URL=http://graph:8001
      - GRAPH_API_URL=http://graph:8001
      - CORS_ORIGIN=http://frontend:8501
    networks:
      - arogya-network
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Streamlit Multi-Page Frontend (Internal Only) ───────────────────────────
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: arogya-frontend
    restart: unless-stopped
    expose:
      - "8501"
    environment:
      - BACKEND_URL=http://backend:5000/api/v1
      - ML_API_URL=http://ml:8000
      - GRAPH_API_URL=http://graph:8001
    networks:
      - arogya-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  arogya-network:
    driver: bridge

volumes:
  mongo_data:
