name: ArogyaMitra Continuous Integration

on:
  push:
    branches: [ main, remediation, phase-* ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret & Credential Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify No Live Secrets or Real .env Files
        run: |
          echo "Scanning git repository for committed .env files..."
          COMMITTED_ENVS=$(git ls-files | grep -i "\.env$" || true)
          if [ -n "$COMMITTED_ENVS" ]; then
            echo "CRITICAL: Found real .env files committed to git:"
            echo "$COMMITTED_ENVS"
            exit 1
          fi
          echo "Passed: Only .env.example files found in version control."

  backend-tests:
    name: Backend Security, Lint & Concurrency Tests (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Run ESLint & Dependency Audit
        working-directory: ./Backend
        run: |
          npm run lint
          npm audit --audit-level=high

      - name: Run Security & Concurrency Vitest Suites
        working-directory: ./Backend
        env:
          JWT_SECRET: "ci_pipeline_test_secret_key_minimum_32_characters_long"
          INTERNAL_SERVICE_SECRET: "arogyamitra_internal_service_token_secret_key_32chars!"
          ENCRYPTION_KEY: "arogyamitra_aes_256_secret_key_32bytes!"
          NODE_ENV: "test"
        run: npm run test

  python-tests:
    name: ML, Graph AI Pipeline & Streamlit Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9dc2c79245ac605c97076d36e4b8e042 # v5.3.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install ML, Graph & UI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r ML_Model/requirements.txt
          pip install -r graph/requirements.txt
          pip install -r ui/requirements.txt

      - name: Run Python Ruff Linter
        run: |
          ruff check ML_Model graph ui

      - name: Run ML Contract & Hypothesis Property Tests
        run: |
          pytest ML_Model/tests/ -v

      - name: Run Graph AI Pipeline & Safe LLM Tests
        run: |
          pytest graph/tests/ -v

      - name: Run Streamlit UI AppTest Suite
        run: |
          pytest ui/tests/ -v
